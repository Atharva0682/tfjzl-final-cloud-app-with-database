<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Exam Result</h2>
        {% if grade > 70 %}
            <div class="alert alert-success"><h4>Congratulations! You have passed the exam.</h4></div>
        {% else %}
            <div class="alert alert-danger"><h4>You have failed the exam.</h4></div>
        {% endif %}
        <h4>Your total score: {{ grade }}</h4>
        <a href="{% url 'onlinecourse:course_details' course.id %}" class="btn btn-primary">Retake Exam</a>
    </div>
</body>
</html>
